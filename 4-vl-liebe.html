        function pageInIframe() {

            if(forgetPop){

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }

## Tanach/Altes Testament
- Bibel = „Buch der Bücher”
- Altes Testament: ein nachträglicher Begriff
- wichtige Bestandteile: Bücher Mose, Propheten, Spruchdichtung/Hohelied
- verschiedene Autoren und Redaktoren
- unterschiedliche Gottesbilder und Glaubensformen
- [!] Zeitraum: 12. bis 2. Jhdt. v. Chr.

</div>
</div>

<aside class="notes"><ul>
<li>jüd. Tanach = Altes Testament/Alter Bund (2. Korinther 3,14: <em>palaià diathḗkē</em>)</li>
<li>Tora/Weisung = die historischen Bücher</li>
<li>Nevi’im/Propheten = die (vorderen und hinteren) Propheten</li>
<li>Ketuvim/Schriften = die poetischen Bücher</li>
</ul>
</aside></script></section><section ><section data-separator="?

<aside class="notes"><ul>
<li>Jahreszahlen offen datiert; die Angaben bezeichnen die Entstehung der Texte, nicht die erzählte Zeit</li>
<li>Bücher Mose: erzählte Frühzeit (Erzväter bis Landnahme), verschriftlicht aber erst 8.-5. Jh. – daher zweigeteilt; das gelobte Land als Versprechen für Treue (Bundesgabe), Problematik der Untreue (Bund verkehrt sich in Fluch; Lev 26, Dtn 28)</li>
<li>Propheten: deuten das Leben im Land und seinen Verlust; sie verstehen das Exil als Strafe für Untreue und künden von einem neuen Bund; dabei greifen sie auf eine Logik aus der Tora zurück (Buch = Segen bei Treue, Fluch bei Untreue)</li>
<li>Schriften: vielfältige Werke (Psalmen, Weisheit, Chronik u. a.), die Tora und Propheten aufnehmen und weiterführen, teilweise aber auch ebenso alt sind; poetischer Charakter</li>
<li>Hohelied: Salomo zugeschrieben, aber erst hellenistisch verschriftlicht – vgl. Hohelied-Folie</li>
</ul>

## Geschichte Israels im Spiegel des AT
- **Erzväter und Exodus**: Bundesschlüsse, Befreiung aus Ägypten, Wüstenwanderung
- **Ansiedlung und Richterzeit**: Landnahme in Kanaan, Stämmeverband
- **Monarchie**: Saul, David, Salomo; Reichsteilung, 722 Untergang des Nordreichs
- **Exil**: 586 Zerstörung Jerusalems und des Tempels, Deportation nach Babylon
- **Rückkehr und zweiter Tempel**: 538 Kyros-Erlass, Wiederaufbau; danach hellenistische Zeit bis zu den Makkabäern
- [>] Ausblick Neues Testament: römische Besetzung 63 v. Chr., Zerstörung des Tempels 70 n. Chr.

</div>
</div>

<aside class="notes"><ul>
<li>Erzväter: Abraham, Isaak, Jakob, Josef – Vorgeschichte, die erklärt, wie Israel nach Ägypten kommt</li>
<li>722 Nordreich (Assyrer) vs. 586 Juda (Babylonier): „Exil“ im engeren Sinn ist 586–538</li>
<li>Hiskia und Joschija (Reformen, 8./7. Jh.): Gerichtsworte der Propheten an König und Volk</li>
<li>Hellenistische Zeit 4.–2. Jh.: Ptolemäer und Seleukiden, Makkabäeraufstand 167; in dieser Phase Kanonisierung der Schriften, darunter das Hohelied</li>
<li>für die Sitzung wichtig: Exil (Gericht und Hochzeitsmetapher) und hellenistische Kanonisierung (Hohelied als Liebesdichtung im Kanon)</li>
</ul>
</aside></script></section></section><section ><section data-separator="?

## Propheten: Jeremia (~7. Jhdt. v.Chr.)
- ["] So spricht der HERR: Ich gedenke der Treue deiner Jugend und der Liebe deiner Brautzeit, wie du mir folgtest in der Wüste, im Lande, da man nicht sät. Da war Israel dem HERRN heilig, die Erstlingsfrucht seiner Ernte. Wer davon essen wollte, machte sich schuldig, und Unheil musste über ihn kommen, spricht der HERR. \[…\] Und ich brachte euch in ein fruchtbares Land, dass ihr äßet seine Früchte und Güter. Aber als ihr hineinkamt, machtet ihr mein Land unrein und mein Eigentum mir zum Gräuel. Die Priester fragten nicht: Wo ist der HERR?, und die Hüter des Gesetzes achteten meiner nicht, und die Hirten des Volks wurden mir untreu, und die Propheten weissagten im Namen des Baal und hingen den Götzen an, die nicht helfen können. Darum muss ich noch weiter mit euch und mit euren Kindeskindern rechten, spricht der HERR. (Jer 1,2-9)
<p class="source">Die Bibel nach Martin Luthers Übersetzung, revidiert 2017, Deutsche Bibelgesellschaft, Stuttgart.</p>

## Das Hohelied: Ein Skandal
- König Salomo (10. Jhdt. v.Chr.) zugesprochen, aber vermutlich viel später entstanden und bis ins 2. Jhdt. v.Chr. veränderlich
- Kontexte: heilige oder menschliche Hochzeit?
- sinnliche Liebeslieder – Ort in der Bibel? → allegorische Auslegungsstrategien
- Textschwierigkeiten (Übersetzung, Einteilung/Struktur, Sprecherrollen und narrativer Zusammenhang, fremde Bildsprache)

</div>
</div>

<aside class="notes"><h2 id="gründe-für-übersetzungsschwierigkeiten">Gründe für Übersetzungsschwierigkeiten</h2>
<ul>
<li>unsicherer hebräischer Text: viele hapax legomena, Lehnwörter, mehrere Lesarten</li>
<li>nicht eindeutig auflösbare Bildsprache (Tauben, Türme, Weizenhaufen)</li>
<li>Sprecherrollen im hebräischen Text nicht markiert</li>
<li>Übersetzungstradition von der Allegorese geprägt (Dämpfung des Sinnlichen)</li>
</ul>
</aside></script></section><section data-separator="?

## Das Hohelied: Aspekte der Lektüre
- 8,6: Liebe als göttliche Gabe
- 2, 1-4 und 7,12-13: Sehnsucht und Erfüllung der Liebe
- 1, 9-17 und 4,1-7: Bildsprache, Vergleiche

</div>
</div>

<aside class="notes"><ul>
<li>Das Hohelied ist im Kanon ein Fremdkörper: kein Gesetz, kein Gebet, kein Gottesnamen im Text</li>
<li>Vergleiche mit Tauben, Türmen, Herden: die Geliebte ist aus Tieren, Landschaft, Natur zusammengesetzt – keine naturalistische Beschreibung, sondern rhetorische Konstruktion von Sinnlichkeit</li>
</ul>

## Das Hohelied: Interpretationen der Liebe
- die zwischengeschlechtliche Liebe als Geschenk Gottes (vgl. [1 Mose 2,23-25](#Mose))
- AT: Abbild der Verbindung zwischen Gott und seinem Volk (Jer 2,2; Hos 1-3)
- NT: … zwischen Christus und seiner Gemeinde ([Eph 5,25.31-32](#Epheser))
- Mystik: zwischen Christus und der Seele
- [>] Eingang dieser Dimensionen auch in die weltliche Dichtung (Bsp. *Tristan*)
- [>] ein Gedicht über (erotische) Sinnsuche?

</div>
</div>

<aside class="notes"><ul>
<li>zentrale Frage: Wessen Liebe ist gemeint? die Liebenden selbst (Schöpfungsgabe), Gott und Volk (Propheten), Christus und Gemeinde (Eph 5), Christus und Seele (Mystik). </li>
<li>Wichtig: Die allegorische Auslegung ist keine Verdrängung des Körperlichen, sondern eine Verdopplung – der Körper bleibt lesbar, bekommt aber einen zweiten Sinn.</li>
<li>das wird bes. in der weltlichen Dichtung betont, in der Liebe zwischen Körperlichkeit und Transzendenz schwankt <em>(Tristan)</em></li>
</ul>
</aside></script></section><section data-separator="?

## Paulus: Ehe als Symbol
- ["] Ihr Männer, liebt eure Frauen, wie auch Christus die Gemeinde geliebt hat (…) Wer seine Frau liebt, der liebt sich selbst. Denn niemand hat je sein eigenes Fleisch gehasst; sondern er nährt und pflegt es wie auch Christus die Gemeinde. Denn wir sind Glieder seines Leibes. »Darum wird ein Mann Vater und Mutter verlassen und an seiner Frau hängen, und die zwei werden ein Fleisch sein.« [(1 Mose 2,23-25)](#Mose) Dies Geheimnis ist groß; ich deute es aber auf Christus und die Gemeinde. (Eph 5, 25-32)
<p class="source">Die Bibel nach Martin Luthers Übersetzung, revidiert 2017, Deutsche Bibelgesellschaft, Stuttgart.</p>

## Die Bergpredigt: Liebe und Gesetz
- ["] Ihr sollt nicht meinen, dass ich gekommen bin, das Gesetz oder die Propheten aufzulösen; ich bin nicht gekommen aufzulösen, sondern zu erfüllen. Denn wahrlich, ich sage euch: Bis Himmel und Erde vergehen, wird nicht vergehen der kleinste Buchstabe noch ein Tüpfelchen vom Gesetz, bis es alles geschieht. (Mt 5:17-18)
- ["] Ihr habt gehört, dass gesagt ist (2 Mose 20:14): »Du sollst nicht ehebrechen.« Ich aber sage euch: Wer eine Frau ansieht, sie zu begehren, der hat schon mit ihr die Ehe gebrochen in seinem Herzen. (Mt 5:27-28)
- ["] Alles nun, was ihr wollt, dass euch die Leute tun sollen, das tut ihnen auch! Das ist das Gesetz und die Propheten. (Mt 5:12, vgl. Mt 22,35-39)
<p class="source">Die Bibel nach Martin Luthers Übersetzung, revidiert 2017, Deutsche Bibelgesellschaft, Stuttgart.</p>
</div>

## Paulus: Liebe und Gesetz
- ["] Seid niemandem etwas schuldig, außer dass ihr euch untereinander liebt; **denn wer den andern liebt, der hat das Gesetz erfüllt.** Denn was da gesagt ist (2.Mose 20,13-17): »Du sollst nicht ehebrechen; du sollst nicht töten; du sollst nicht stehlen; du sollst nicht begehren«, und was da sonst an Geboten ist, das wird in diesem Wort zusammengefasst (3.Mose 19,18): »Du sollst deinen Nächsten lieben wie dich selbst.« Die Liebe tut dem Nächsten nichts Böses. So ist nun die Liebe des Gesetzes Erfüllung. (Röm 13:8-10)
<p class="source">Die Bibel nach Martin Luthers Übersetzung, revidiert 2017, Deutsche Bibelgesellschaft, Stuttgart.</p>
