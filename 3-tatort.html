                    const element = itemsToFit[item];

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;

                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

## Campus-Roman
- Definition
- historischer Kontext
- typische Konflikte
- [!] Campus als „soziales Feld” (Bourdieu)
<p class="source">Showalter, Elaine. (2005). <em>Faculty Towers: The Academic Novel and Its Discontents.</em> Oxford UP.</p>

</div>
</div>

<aside class="notes"><ol>
<li><strong>Definition:</strong> Die Campus Novel ist ein meist satirischer Hochschulroman, in dessen Zentrum eine Universität als sozial abgeschlossene Welt mit eigenen Hierarchien, Ritualen und Sprachspielen steht.</li>
<li><strong>Historischer Kontext:</strong> Im engeren Sinn etabliert sich die Gattung vor allem in der britischen und US-amerikanischen Literatur der Nachkriegszeit; wichtige Beispiele sind Kingsley Amis’ <em>Lucky Jim</em> (1954), David Lodges Campusromane und Malcolm Bradburys <em>The History Man</em> (1975).</li>
<li><strong>Typische Konflikte:</strong> Im Mittelpunkt stehen Spannungen zwischen Tradition und Modernisierung, akademischer Freiheit und institutioneller Bürokratie, Forschung und Karriere sowie Wissen und Macht.</li>
<li><strong>Satire und Mikrokosmos:</strong> Der Campus fungiert als Modell der Gesellschaft. Rangordnungen, Geschlechterrollen, Klassenunterschiede und politische Konflikte werden im scheinbar abgeschlossenen Universitätsmilieu sichtbar und häufig komisch oder kritisch zugespitzt.</li>
<li><strong>Einordnung von <em>Gaudy Night</em>:</strong> Sayers’ Roman von 1935 ist keine Campus Novel im engeren, später etablierten Sinn, aber ein wichtiger Vorläufer: Das Frauen-College in Oxford wird als akademische Gemeinschaft untersucht, während Detektivroman, Gesellschaftsroman und feministischer Bildungsroman miteinander verbunden werden.</li>
</ol>
</aside></script></section><section data-separator="?

## Soziales Feld
- Positionen und Relationen
- ungleiche Ressourcen und Kapital
- implizite Regeln (doxa)
- verinnerlichte Wahrnehmungs- und Handlungsmuster (Habitus)
- [>] in Bezug auf Campus: wer darf mit wissenschaftlicher Autorität sprechen und wird gehört? 
- [>] welche verborgenen Strukturen prägen den Raum, in dem „objektives Wissen” produziert wird? wie kann ein Mitglied der Academia darüber forschen?
<p class="source">Bourdieu, Pierre: <em>Homo Academicus</em>. Stanford: Stanford University Press, 1988 [frz. 1984].</p>

</div>
</div>

<aside class="notes"><ul>
<li>„soziales Feld” (relational) statt „Schauplatz” (topografisch)</li>
<li><strong>Relationale Positionen:</strong> Eine Figur ist nicht einfach „angesehen“ oder „unbedeutend“, sondern nimmt eine bestimmte Position im Verhältnis zu anderen ein.</li>
<li><strong>Ungleiche Ressourcen:</strong> Die Beteiligten verfügen über unterschiedlich viel kulturelles, institutionelles und symbolisches Kapital – etwa Wissen, akademische Titel, Kontakte, Reputation oder institutionelle Zugehörigkeit.<ul>
<li>was bringt der Kapitalbegriff: Vergleichbarkeit und Übergang zwischen verschiedenen Formen von Kapital; kann angesammelt, eingesetzt, weitergegeben und umgewandelt werden; kann im sozialen Feld Zinsen abwerfen</li>
</ul>
</li>
<li><strong>Unsichtbare Regeln:</strong> Das Feld legt fest, welche Ausdrucksweisen, Verhaltensformen und Leistungen als seriös, wissenschaftlich oder angemessen gelten.</li>
<li><strong>Kämpfe um Anerkennung:</strong> Die Figuren konkurrieren nicht nur um Stellen oder Einfluss, sondern auch darum, was überhaupt als wertvolles Wissen und legitime Autorität gilt.</li>
<li><strong>Ein- und Ausschlüsse:</strong> Der Feldbegriff hilft zu erklären, warum bestimmte Personen selbstverständlich dazugehören, während andere – etwa Frauen, Außenseiter oder Personen mit fremdem kulturellem Hintergrund – ihre Zugehörigkeit erst beweisen müssen.</li>
<li><strong>Veränderung und Konflikt:</strong> Ein Feld ist nicht statisch. Neue Akteure, Ideen oder gesellschaftliche Entwicklungen können etablierte Hierarchien infrage stellen</li>
<li>[&quot;] Bourdieu sah das Grundproblem, dass die Wissenschaftler klassifizieren, ohne die Produktionsbedingungen ihrer Klassifikations-Kriterien zu reflektieren. Das übergeordnete Ziel der Studie ist es, den Einfluss der sozialen Determinismen auf die wissenschaftlichen Untersuchungskriterien unter Kontrolle zu bringen (die Objektivierung des objektivierenden Subjekts). Das besondere an Bourdieus Studie liegt darin, dass sie, im Gegensatz zu den meisten Texten, die „von ihrem jeweiligen Produktions- und Verwendungszusammenhang“ (Bourdieu 1988: 14) abstrahieren, „den eigenen Kontext mit vermittelt“. Bourdieu ist selbst Teil der Welt, deren Mechanismen er aufdeckt und die er kritisiert (S. 13). <a href="https://de.wikipedia.org/wiki/Homo_academicus">(wiki)</a></li>
</ul>

## Diskussionsthemen
- Harriet und ihr Verhältnis zum College: zwischen Nostalgie und Entfremdung (Kap. 1, S. 8–10, 14, 21); Verhältnis zu ihrem Begehren (Liebe, Beruf) nach Gespräch mit Miss de Vine („overmastering importance”, 38)
- das College als Institution: die Zeremonie der Einweihung der Uhr
- „male criticism”: das College im Universitätsverbund
	- ["] All the men have been amazingly kind and sympathetic about the Women’s Colleges. Certainly. But you won’t find them appointing women to big University posts. That would never do. The women might perform their work in a way beyond criticism. But they are quite pleased to see us playing with out little toys. (Miss Hillyard, 54)
- Harriet und Lord Wimsey (9, 30f., 46)
- Harriet’s take on mystery novels (and detection): 33f. – „Planck’s constant”, Quantenphysik und Unschärferelation (verborgene Variable oder Grenze des Wissens)
- Phoebe Tucker: die Akademiker-Ehe und ihr Blick auf die Familie (18f.)
- Catherine Freemantle: die vielversprechende Wissenschaftlerin, die als Bäuerin geendet ist (47) – Diskussion über Beruf und Berufung (47f.) und die Heirat als Beruf (48) – berühmte Mütter und Väter
- Miss Lydgate: Tutorin, „great scholar”, weltfremd und gutmütig (19f.)
- Miss de Vine: Fellow, intelligent, hart, unbeugsam, ohne Sozialkompetenz (22–25), on knowledge and desire (38f.), ungeschickt in Bezug auf Körperlichkeit
- Miss Schuster-Slatt: American, against „marriage of the unfit” (45)
- Mary of Shrewsbury und die Problematik der intelligenten Ehefrau (52)
- der Fall: Auftauchen des ersten Schnipsels (39), Auffinden des zweiten Schnipsels (57)
