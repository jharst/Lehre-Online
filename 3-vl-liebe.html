                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

## Antike und klassizistische Tragödie
- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Antike: Tragödie, Dionysos-Kult, Demokratie
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Klassizismus: höfische Repräsentation, Professionalisierung, Regelpoetik
	- Einheit von Ort, Zeit und Handlung
	- Stände- und Stillehre
	- „Querelle des Anciens et des Modernes” (Perrault vs. Boileau)

</div>
</div>

<aside class="notes"><ul>
<li>Wikipedia zur <a href="https://de.wikipedia.org/wiki/Querelle_des_Anciens_et_des_Modernes">Querelle des Anciens et des Modernes</a></li>
<li>zentrale Frage: Vergleichbarkeit frz. Klassik und klassische Antike, dazu: Versöhnbarkeit christliche Religion / antikes Heidentum – kann die moderne Zeit in antiken Formen verherrlicht werden? </li>
<li>Boileau (Anciens): die Antike ist das unerreichte Vorbild; richtig ist, was den Regeln der Vernunft (raison) und der „Natur” folgt; Nachahmung der Alten als Weg zur Vollkommenheit (Regelpoetik); Kritik an allem „Barocken” (Schwulst, Übertreibung, Unregelmäßigkeit)</li>
<li>Perrault (Modernes): die Gegenwart kann die Antike übertreffen; Fortschritt durch Wissenschaft und Kunst; Vergleich der eigenen Epoche mit dem augusteischen Zeitalter (Louis XIV = Augustus) – für Boileau ist dieser Vergleich eine Anmaßung</li>
<li>Racine (vermittelt): steht auf Seiten der Anciens, arbeitet aber mit den Alten, statt sie nur zu bewundern – er will sie übertreffen (emulatio), passt Stoffe und Personal an zeitgenössische Erwartungen an, arbeitet Regelmäßigkeiten weiter heraus; darin liegt seine implizite Kritik an der starren Regelpoetik</li>
<li>Merksatz für Erstsemester: Boileau = die Alten sind das Maß; Perrault = wir sind weiter als die Alten; Racine = die Alten sind das Vorbild, an dem man sich messen und das man überbieten muss</li>
</ul>
</aside></script></section><section data-separator="?

## Racine (1639-1699)
- jansenistische Ausbildung im Kloster Port-Royal (Versailles)
	- Prädestinationslehre, kein freier Wille und Souveränität
	- Bedeutung für tragische Verstrickung (Mensch kann sich nicht selbst retten) 
- altphilologische Kenntnisse (Auseinandersetzung mit antiker Poetik)
- Karriere als Höfling und Schriftsteller

</div>
</div>

<aside class="notes"><!-- begin::[Racine und Jansenismus.md] -->
<h2 id="racine-und-jansenismus">Racine und Jansenismus</h2>
<ul>
<li>Jansenismus: Reformbewegung in der Nachfolge Cornelius Jansens, die sich auf Augustinus’ Gnadenlehre beruft – „Jansen lehrte, dass der in Sünde gefallene Mensch keinen eigenen Einfluss auf seine Erlösung habe, sondern dem göttlichen Gnadenwillen völlig ausgeliefert sei.” – vgl. protestantische/pietistische Gnadenlehre</li>
<li>vs. Jesuiten/Molinisten, denen zufolge „die göttliche Gnade und die menschliche Willensfreiheit bei der Erlangung des Seelenheils zusammenwirkten”</li>
<li>Leibfeindlichkeit? → Phèdre</li>
<li>päpstlich verboten und staatlich verfolgt (u.a. Schließung Port-Royal, 1758)</li>
<li>Wikipedia zu <a href="https://de.wikipedia.org/wiki/Jansenismus">Jansenimus</a> und <a href="https://de.wikipedia.org/wiki/Racine">Racine</a><!-- end::[Racine und Jansenismus.md] --></li>
</ul>

## Racine nach Auerbach
Die Einheit von Ort, Zeit und Handlung der Tragödie zeigt die völlige Abschließung der tragischen Person gegenüber der alltäglichen Wirklichkeit und insbesondere gegenüber den unteren Ständen. Diese „atmosphärische Isolierung“, die mit einem modernen Experiment verglichen werden kann, weil sie eine ungestörte Betrachtung der psychischen Vorgänge gestattet, erzeugt eine gewaltige Wirkung der Emotionen. Diese klassische französische Vorstellung von Erhabenheit dürfe durch keine Nebenfiguren, keine Alltagshandlungen und kein Zeichen der Hinfälligkeit der fürstlichen Personen getrübt werden – außer durch den Tod. Dadurch nähere sich die Handlung einer Tragödie wie *Phèdre* dem „Absoluten und Außergeschichtlichen“ und erreiche eine „beispielhafte, allgemeingültige Einfachheit“, was damals als Essenz von Natürlichkeit und Vernunft erschien.
</div>

<!-- .element: style="text-align: left" -->

<div class="block">

Quelle: wikipedia, Art. [Racine](https://de.wikipedia.org/wiki/Jean_Racine#Racine_als_sp%C3%A4tbarocker_Dichter_des_Erhabenen), Online (07.01.2025), zitiert und paraphrasiert Erich Auerbach: *Mimesis* (1946/2001), S. 352-365.
</div>

### Auerbach: Liebe als Passion

<!-- begin::[@Auerbach-1944.md] -->
- ["] In den antiken Werken ist die Liebe nur sehr selten ein Gegenstand hohen Stils; sie ist dort, wenn sie als Hauptgegenstand, also ohne Verbindung mit anderen, göttlich-schichsalshaften Motiven auftritt, nur in Dichtungen mittlerer Höhenlage behandelt; aber sobald von ihr die Rede ist, sei es selbst in einem erhaben epischen oder tragischen Werk, wird ohne jede Scheu das Körperliche zur Sprache gebracht. Mit der französischen Tragödie ist es gerade umgekehrt. Sie hat die erhabene Auffassung der Liebe übernommen, wie sie sich in der höfischen Kultur und im Petrarkismus weiter ausgebildet hatte; schon bei Corneille ist sie ein tragisch-erhabenes Motiv, unter dem Einfluß der galanten Romane verdrängt sie fast alle anderen hohen Gegenstände […] aber bei alledem ist kaum ein Hauch von dem zu spüren, was der damalige Geschmack als niedrig und ungehörig empfand, vom Körperlichen und Geschlechtlichen. (363) #Quote #Liebe #Tragödie  #Racine
<!-- end::[@Auerbach-1944.md] -->


<div class="block">

Quelle: Auerbach, E. (1994/1946). *Mimesis. Dargestellte Wirklichkeit in der abendländischen Literatur* (10. Aufl.). Francke.

## Rolle Phèdres
<div class="block">

<!-- .element: style="text-align: left !important" -->

<!-- begin::[Racine – Phèdre (KLL).md] -->
Racine stellt in seiner Tragödie zum ersten Mal die Figur der Phèdre ganz in den Vordergrund. Sie ist weder, wie bei [Euripides](http://kll-aktuell.cedion.de/nxt/gateway.dll/kll/r/k0568000.xml/k0568000_100.xml?f=id$id=KINDLER:k0196600$t=index.htm), eine edelmütige Frau, die zum eher beklagenswerten Opfer ihrer eigenen Leidenschaften wird, noch, wie bei Seneca, eine rasende, von tierischen Instinkten getriebene Liebeshungrige. Racines Anliegen ist es, seine Phèdre »weder ganz schuldig noch ganz unschuldig« zu gestalten. Er entlastet sie zum Teil von ihrer Schuld durch die Figur der Kupplerin Oenone sowie dadurch, dass er Phèdres Eifersucht mit der Liebe Hippolytes zu Aricie motiviert.
<!-- end::[Racine – Phèdre (KLL).md] -->


Quelle: Dietrich Briesemeister, [Art. Phèdre](https://link.springer.com/referenceworkentry/10.1007/978-3-476-05728-0_13752-1), in: Kindlers Literatur Lexikon (Online), 2020.
</div>

- ["] [le caractère de Phèdre] „a toutes les qualités qu’Aristote demande dans le héros de la tragédie, et qui sont propres à exciter la compassion et la terreur“ (571); der Charakter Hippolytos’ wurde entsprechend „emendiert“, um der Regel – die hier deutlich auf Vettori Bezug nimmt – zu entsprechen: „j’avais remarqué dans les anciens qu’on reprochait à Euripide de l’avoir représenté comme un philosophe exempt de toute imperfection. Ce qui faisait que la mort de ce jeune prince causait beaucoup plus d’indignation que de pitié“ (572; das Wort „indignation“ stammt aus dem Kommentar Vettoris)
<!-- end::[Racine – Préfaces.md] -->


Quelle: Jean Racine: Phèdre [1677]. Préface, in: Racine: Théâtre, ed. par Edmond Pilon et Renée Groos, Paris: Gallimard 1940, 571-573.<!-- .element: style="font-size: smaller; margin-top: 35px !important; text-align: left !important" -->
