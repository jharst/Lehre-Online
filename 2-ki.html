    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };

## AI Narratives
- ["] The way AI is portrayed is therefore a social, ethical, and political issue. Through shaping the technical field, the acceptance of the resulting technology, and its regulation, and through encoding normative sociopolitical assumptions, these portrayals have far-reaching implications. It is therefore essential that prevalent narratives be critically examined, and that they be contested by the privileging of more sophisticated and complex narratives of AI, both fictional and nonfictional.
<p class="source">Cave, S., Dihal, K., & Dillon, S. (2020). Introduction. In <em>AI Narratives.</em> Oxford UP.</p>
</div>

<div class="" style="padding: 20px; box-sizing: border-box; position: absolute; left: 10%; top: 10%; height: 80%; width: 80%; display: flex; flex-direction: column; align-items: start; justify-content: center" align="center">


## Zum Begriff des Narrativs
- Narrative sind kollektiv **geteilte Erzählmuster** (keine einzelnen *stories*), die wie kognitive Schemata funktionieren – sie steuern Selektion, Reduktion, Erwartungsbildung, Aufmerksamkeit von Kommunikationsteilnehmern
- Narrative stiften zwei Arten von Belohnungen: **semantische Investitionen** (Sinn/Orientierung, resistent gegen Gegenbeweise) und **Gruppenteilhabe** (Wir-Gefühl, Sicherheit, Handlungsmacht)
- Narrative neigen zur **Personalisierung** von Strukturen: Was nicht auf Akteure zugerechnet werden kann, bleibt unausgeführt – fließender Übergang zur Konspirationstheorie
- **Faktuale und fiktionale** Erzählungen sind nicht per se klar trennbar
<p class="source">Koschorke, A. (2012). Wahrheit und Erfindung. Grundzüge einer allgemeinen Erzähltheorie. Fischer.</p>

</div>
</div>

<aside class="notes"><h3 id="1-beispiel-das-narrativ-von-der-friedlichen-revolution-und-der-wiedervereinigung">1. Beispiel: Das Narrativ von der „friedlichen Revolution“ und der Wiedervereinigung</h3>
<p>Die deutsche Wiedervereinigung wird häufig als zwangsläufiger Erfolg des Freiheitswillens der DDR-Bevölkerung und als glückliche Vollendung der deutschen Einheit erzählt. Dieses Narrativ bündelt komplexe politische, wirtschaftliche und internationale Prozesse – etwa die Bürgerrechtsbewegung, Michail Gorbatschows Politik, die diplomatischen Verhandlungen und die Entscheidungen der Bundesregierung – zu einer sinnstiftenden Erfolgsgeschichte. Es stiftet ein gemeinsames deutsches „Wir“, kann aber zugleich ostdeutsche Erfahrungen von Umbruch, Arbeitslosigkeit und Abwertung ausblenden.</p>
<h3 id="2-beispiel-das-narrativ-vom-deutschen-wirtschaftswunder">2. Beispiel: Das Narrativ vom „deutschen Wirtschaftswunder”</h3>
<p>Der wirtschaftliche Aufschwung der Bundesrepublik in den 1950er- und 1960er-Jahren wird häufig als Ergebnis von Fleiß, Disziplin und sozialer Marktwirtschaft erzählt. Dieses Narrativ verdichtet komplexe Faktoren – etwa den Marshallplan, den Wiederaufbau, den Schuldenerlass, die hohe Nachfrage und die Arbeit von Millionen „Gastarbeiterinnen“ und „Gastarbeitern“ – zu einer nationalen Erfolgsgeschichte. Es stärkt das Selbstbild einer leistungsfähigen Gesellschaft, kann jedoch soziale Ungleichheiten, fortbestehende NS-Strukturen und den Beitrag ausländischer Arbeitskräfte in den Hintergrund rücken.</p>
</aside></script></section><section data-separator="?

## Gängige KI-Narrative
- **Das Aufstiegsnarrativ:** Die Menschheit hat mit KI ein neues Werkzeug geschaffen. Wer ihr Potenzial früh erkennt und in sie investiert, steigt zu den Gewinnern einer neuen Epoche auf; wer zögert, verliert Wohlstand und Einfluss.
- **Das Kontrollverlustnarrativ:** Menschen entwickeln zunächst nützliche KI-Systeme. Diese werden jedoch immer autonomer und leistungsfähiger, bis ihre Schöpfer die Kontrolle verlieren und die gesamte Menschheit bedroht ist.
- **Das Verfallsnarrativ:** Durch synthetische Bilder, Texte und Stimmen wird die Unterscheidung zwischen wahr und falsch zunehmend unmöglich. Vertrauen in Medien, Institutionen und Mitmenschen zerfällt; die Gesellschaft tritt in ein Zeitalter allgemeiner epistemischer Unsicherheit ein.
</div>

## Zum Begriff Transkulturalität
- These: Kulturen sind nicht mehr homogen und klar abgegrenzt (Kugelmodell), sondern intern plural und extern durchlässig/verflochten (Gewebe).
- Kulturelle Determinanten verlaufen heute **quer durch Kulturen**; Kulturen sind durch **Verflechtungen und Gemeinsamkeiten** statt durch stabile Differenzen charakterisiert.
- **Makroebene (Gesellschaft):** Durch **Globalisierung** entstehen starke externe Vernetzungen; Lebensformen überschreiten nationale Grenzen
- **Mikroebene (Individuen):** Identitäten sind **Patchwork-Identitäten**; Menschen sind kulturell mehrfach geprägt
<p class="source">Wolfgang Welsch (2011): „Transkulturalität – neue und alte Gemeinsamkeiten”, in: <em>Immer nur der Mensch? Entwürfe zu einer anderen Anthropologie</em>, hg. von Wolfgang Welsch, Berlin:, 294–311.</p>
</div>
</div></script></section><section data-separator="?

## Bedeutung fürs Seminar

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom
            plugins: [
                ObsidianMarkdown,
                RevealHighlight,
                RevealZoom,
                RevealNotes,
                RevealMath.KaTeX,
                RevealMermaid,
                RevealChart,
                RevealCustomControls,
                RevealMenu,
            ],
            allottedTime: "120",

            katex: {
                local: 'plugin/math/katex',
                extensions: ["mhchem"],
            },
            markdown: {
                gfm: true,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                ]
            },
            menu: {
                loadIcons: false
            },
        };

        if ( pageInIframe() ) {
            defaultOptions.scrollActivationWidth = 5;
        }

        // options from URL query string
        const queryOptions = Reveal().getQueryHash() || {};

        const options = extend(defaultOptions, {"controls":true,"progress":true,"slideNumber":false,"center":false,"transition":"slide","transitionSpeed":"default","width":1920,"height":1080,"margin":0.04}, queryOptions);
    </script>
