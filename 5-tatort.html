        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }

## Hypothese/Abduktion
Man kennt eine Regel und ein Ergebnis und fragt, welcher konkrete Fall dieses Ergebnis erklären könnte:

- *Ergebnis:* Diese Bohnen sind weiß.
- *Regel:* Alle Bohnen aus diesem Sack sind weiß.
- [>] *Hypothese über den Fall:* Diese Bohnen stammen wahrscheinlich aus diesem Sack.

<p class="source">Charles S. Peirce nach Eco, U. (1983). Some Hypotheses on Three Types of Abduction. In U. Eco & T. A. Sebeok (Eds.), <em>The Sign of Three: Dupin, Holmes, Peirce</em> (pp. 198–220). Indiana UP</p>

## Varianten von Hypothesen
### 1. Regel bereits bekannt: Hypothese eines Falls
- *Ergebnis*: Die Straße ist nass.
- *Bekannte Regel*: Regen macht Straßen nass.
- [>] *Hypothese*: Es hat geregnet.

### 2. Fall bekannt, Regel unbekannt: Hypothese einer Regel
- *Fall*: Dieses Metallstück wurde erhitzt.
- *Ergebnis*: Es hat sich ausgedehnt.
- [>] *Hypothese*: Erhitzte Metalle dehnen sich aus.

These: Hypothetisches Denken prägt jede Form von Erkenntnis.
<p class="source">Charles S. Peirce nach Eco, U. (1983). Some Hypotheses on Three Types of Abduction. In U. Eco & T. A. Sebeok (Eds.), <em>The Sign of Three: Dupin, Holmes, Peirce</em> (pp. 198–220). Indiana UP</p>


</div>

<div class="vl-text-photo-source"><a href="#" title="" target="_blank">Bildnachweis<i class="fas fa-external-link-alt link-icon"></i></a></div>
</div>
</div>

<aside class="notes"><p>In Fall 2 wird eine mögliche Regel erschlossen; Ähnlichkeit zur Induktion; Unterschied liegt darin, dass die Regel bei der Abduktion zunächst als <strong>Erklärung oder Vermutung</strong> vorgeschlagen wird; bei der Induktion wird sie aus einer Reihe von Fällen verallgemeinert und überprüft.</p>

## Sprachverstehen als „undercoded abduction”
### 1. Lexikalische Identifikation: Zeichenfolge → Wort
- *Ergebnis:* Die Zeichenfolge „Bank“ erscheint in einer Äußerung.
- *Regel/Code:* Im deutschen Wortschatz gibt es das Wort _Bank_; bestimmte Laut- und Schreibmuster können als deutsche Wörter identifiziert werden.
- [>] *Hypothese über den Fall:* Die Zeichenfolge ist wahrscheinlich das deutsche Wort _Bank_ und gehört zum deutschen Wortschatz.
### 2. Semantische Interpretation: Wort → Bedeutung
- *Ergebnis:* Jemand sagt: „Ich gehe zur Bank.“
- *Regel/Code:* Das Wort _Bank_ hat mehrere mögliche Bedeutungen, unter anderem „Sitzmöbel“ und „Geldinstitut“.
- [>] *Hypothese über den Fall:* Gemeint ist wahrscheinlich das Geldinstitut.

<p class="source">Eco, U. (1983). Some Hypotheses on Three Types of Abduction. In U. Eco & T. A. Sebeok (Eds.), <em>The Sign of Three: Dupin, Holmes, Peirce</em> (pp. 198–220). Indiana UP</p>
</div>

## Invention/kreative Abduktion
Man kennt ein Ergebnis und fragt, a) welcher Fall vorliegt und b) begründet dies mit einer angenommenen möglichen Regel.
- *Ergebnis*: Ein Fenster ist beschädigt, auf dem Fußboden liegen Scherben.
- *Regel*: Ein Einbrecher, der durch ein Fenster eindringt, hinterlässt solche Spuren.
- [>] *Fall*: Jemand ist durch das Fenster eingebrochen.
- Problem: Wie kann die Existenz von Regel und Fall beweisen werden? 

<p class="source">Eco, U. (1983). Some Hypotheses on Three Types of Abduction. In U. Eco & T. A. Sebeok (Eds.), <em>The Sign of Three: Dupin, Holmes, Peirce</em> (pp. 198–220). Indiana UP</p>

## Plausibilisierung
- Ästhetische und ökonomische Aspekte (Kohärenz, Eleganz/Sparsamkeit, Wahrscheinlichkeit)
- [>] eine überzeugende kreative Abduktion macht möglichst viele verstreute und unverständliche Einzelheiten durch eine möglichst einfache Regel zu einem kohärenten „Fall”
- Meta-Abduktion (die Welt, in der die erfundene Regel gilt, ist die Welt der Wahrnehmung)

<p class="source">Eco, U. (1983). Some Hypotheses on Three Types of Abduction. In U. Eco & T. A. Sebeok (Eds.), <em>The Sign of Three: Dupin, Holmes, Peirce</em> (pp. 198–220). Indiana UP</p>

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
