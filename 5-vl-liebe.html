                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

- Sokrates: Ohne Bezug auf Wahrheit wäre gar keine Erkenntnis möglich, es muss sie also geben, auch wenn sie unerreichbar sein mag

<li>399 v.Chr.: Sokrates wegen Gottlosigkeit und Verführung der Jugend zum Tod verurteilt – in seiner Verteidigungsrede steht Sokrates zu seinen „Fehlern”, ja fordert das Gericht offen heraus</li>

<li>wichtigstes Zeugnis: Dialog „Apologie des Sokrates” von seinem Schüler Platon (deutlich später verfasst) – gestaltet Verurteilung und Tod Sokrates’ als Vollendung seiner Lehre</li>
<li>im Gemälde ist Platon der bärtige Mann am Fußende: deutlich älter dargestellt als historisch richtig (= das Gemälde zeigt die Szene aus der Perspektive des alten Platon)</li>

### Pausanias: Erotik und Erkenntnis
- ["] Denn das ist bei uns Sitte, wenn jemand einem anderen ergeben sein will, weil er glaubt, besser durch ihn zu werden, es sei in irgendeiner Einsicht oder in einem anderen Teile der Tugend, dass ein solcher freiwilliger Dienst nicht schändlich sei, noch eine Niedrigkeit. Dann, wenn beide so zusammen treffen, Liebhaber und Liebling, dass jeder die Meinung für sich hat, jene die, dass er recht daran tue, dem Liebling, der ihm gefällig geworden, jeglichen Dienst zu erzeugen, dieser aber die, dass es recht sei, dem, der ihn weise und gut macht, was es auch immer sei, zu erweisen, und dann jener auch wirklich vermag, zur Weisheit und Tugend behilflich zu sein, dieser aber begehrt, zur Bildung und zu jeglicher Art der Weisheit Hilfe zu erlangen, dann also, wenn diese beiden Satzungen übereinkommen, da allein trifft es auch zu, daß es schön ist für den Liebling, dem Liebhaber gefällig zu sein, sonst aber nirgends. (184c-e)  (41)
<!-- end::[Platon – Symposion.md] -->

### Aristophanes: Definition der Liebe
- ["] Hiervon ist nun dies die Ursache, daß unsere ursprüngliche Beschaffenheit diese war und wir ganz waren, und dies Verlangen eben und Trachten nach dem Ganzen heißt Liebe. (…) daß unser Geschlecht glückselig würde, wenn es uns in der Liebe gelänge und jeder seinen eigentümlichen Liebling gewönne, um so zur ursprünglichen Natur zurückzukehren. (…) (193a, 63)
- ["] Wenn wir nun also den Gott preisen wollen, dem wir das verdanken, so müssen wir gerechterweise den Eros preisen, der uns schon jetzt am meisten Gutes erweist, weil er uns zu dem hinführt, was uns verwandt ist, und der uns für die Zukunft die größten Hoffnungen haben läßt, wenn wir uns nur den Göttern gegenüber fromm zeigen; dann versetzt er uns in den ursprünglichen Zustand und heilt uns und macht uns damit glücklich und selig. (193cd; 65)
<!-- end::[Platon – Symposion.md] -->

- moralische Wirkung des Schönen

### Sokrates/Diotima: Das Dämonische
- ["] Es verdolmetscht und überbringt den Göttern, was von den Menschen kommt, und den Menschen, was von den Göttern kommt: von den einen die Gebete und Opfer, von den anderen die Befehle und die Vergeltung für die Opfer. Es steht in der Mitte zwischen beiden und füllt die Kluft aus, so daß das All in sich verbunden ist. \[…\] Ein Gott aber verkehrt nicht mit einem Menschen, sondern durch dieses Daimonische geschieht aller Umgang und alle Zwiesprache zwischen Göttern und Menschen, im Wachen wie im Schlafen. Und wer sich darauf versteht, der ist ein daimonischer Mann; wer aber sonst auf einem Gebiet Bescheid weiß \[…\], der ist ein gewöhnlicher Mann. (202e-203a, 93)
<!-- end::[Platon – Symposion.md] -->

### Sokrates/Diotima: Aufstieg zum Schönen

<!-- begin::[Platon – Symposion.md] -->
- ["] Denn das bedeutet den rechten Weg zu den Dingen der Liebe gehen oder von einem anderen geführt werden, daß man, mit diesen schönen Dingen hier beginnend, um jenes Schönen willen immer weiter hinaufsteigt, wie auf Stufen: von einem schönen Leibe zu zweien und von zweien zu allen schönen Leibern, und von den schönen Leibern zu den schönen Einrichtungen und von den Einrichtungen zu den schönen Wissenschaften, bis man dann von den Wissenschaften aus zu jener Wissenschaft gelangt, die die Wissenschaft von nichts anderem als von jenem Schönen selbst ist, und er schließlich das erkennt, was das Schöne selbst ist. (211c, 117)
<!-- end::[Platon – Symposion.md] -->

### Sokrates/Diotima: Ethische Wirkung des Schönen

<!-- begin::[Platon – Symposion.md] -->
- ["] An dieser Stelle im Leben, mein lieber Sokrates \[…\] wenn überhaupt irgendwo, ist das Leben für den Menschen lebenswert: wenn er das Schöne selbst schaut. Wenn du es einmal erblickst, so wirst du den Eindruck haben, daß es ganz anders ist als Gold und Gewänder und als die schönen Knaben und Jünglinge \[…\]  wenn es einem zuteil würde, das Schöne selbst lauter, rein und unvermischt zu sehen, nicht voll von menschlichem Fleisch und von Farben und von all dem anderen sterblichen Flitter, sondern wenn er das göttliche Schöne selbst in seiner Eingestaltigkeit zu sehen vermöchte? Glaubst du \[…\] es werde ein Mensch ein schlechtes Leben führen, der dorthin schaut und das anblickt und mit ihm zusammen ist? (211de, 117–119)
<!-- end::[Platon – Symposion.md] -->

## Symposion: Alkibiades
- Verhältnis Alkibiades-Sokrates-Agathon
- Sokrates als begehrenswerter Silen („wahrhaft dämonischer Mensch”, 219c)
- moralische Wirkung seines vorbildlichen Lebens
- verkehrt die Rollen von Liebhaber/ Lehrer und Geliebtem/Schüler
- widerlegt damit seine Eros-Lehre?


</div>

<aside class="notes"><ul>
<li><strong>Agathon</strong> verkörpert die äußerlich-sinnliche Schönheit und ist als junger Dichter der konventionell begehrenswerte Geliebte.</li>
<li><strong>Sokrates</strong> verkörpert die schwer zugängliche geistige Schönheit und entzieht sich der erotischen Vereinnahmung.</li>
<li><strong>Alkibiades</strong> steht zwischen beiden Formen des Eros: Er kann Agathons Schönheit unmittelbar begehren, wird aber von Sokrates’ innerer Überlegenheit gerade deshalb gefesselt, weil sie sich seinem Besitzanspruch entzieht.</li>
</ul>
